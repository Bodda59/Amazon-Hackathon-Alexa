<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Nutrition</title>
<link rel="stylesheet" href="shared.css"><body><div id=app class=sub>Loading today…</div><p id=msg class=sub></p>
<script src="shared.js"></script>
<script>
const M=[['kcal','🔥','Calories'],['protein_g','🥩','Protein'],['carbs_g','🍞','Carbs'],['fat_g','🥑','Fat']];
MCP.start((d,s)=>{
 const t=d.targets||d.target||{},r=d.remaining||{},c=d.consumed||d.totals||d.eaten||{};
 const get=(o,k)=>o[k]??(k==='kcal'?o.calories:undefined);
 $('#app').innerHTML=`<h1><span class=ic>📊</span>Today</h1><p class=sub>${esc(s.spoken_summary)}</p>
  ${M.map(([k,i,l])=>{const T=get(t,k),R=get(r,k);let C=get(c,k);if(C==null&&T!=null&&R!=null)C=T-R;
   const left=R??(T!=null&&C!=null?T-C:null),pct=T?Math.min(100,Math.max(0,100*(C||0)/T)):0;
   return `<div class=row style="display:block"><div style="display:flex;gap:10px">${i}<span class=n>${l}</span>
    <b>${left==null?'–':Math.round(left)}</b><small>left${T?' of '+Math.round(T):''}</small></div>
    <div class=bar><i style="width:${pct}%;${left<0?'background:var(--bad)':''}"></i></div></div>`}).join('')}${raw(d)}`;
});
</script>
